version: "3"

vars:
  HUGO_BIN: hugo
  OUTPUT_DIR: public
  # Documentation directories published from other projects (built output only).
  DOCS_DIRS: mcp-searchable mcp-tuikit solidref coding-standards

tasks:
  build:
    desc: Build the production site (minified), then copy the documentation sites into the output.
    cmds:
      - "{{.HUGO_BIN}} --cleanDestinationDir --gc --minify"
      - task: docs:copy
    sources:
      - "hugo.toml"
      - "content/**"
      - "themes/**"
      - "assets/**"
      - "static/**"
    generates:
      - "{{.OUTPUT_DIR}}/index.html"

  serve:
    desc: Serve the blog locally with drafts and live reload (docs dirs are served by GitHub Pages, not Hugo).
    cmds:
      - "{{.HUGO_BIN}} server --buildDrafts --buildFuture --watch --disableFastRender"
    interactive: true

  clean:
    desc: Remove the generated site output directory.
    cmds:
      - "rm -rf {{.OUTPUT_DIR}}"
    silent: true

  rebuild:
    desc: Clean then build the production site.
    deps: [clean]
    cmds:
      - task: build

  docs:copy:
    desc: Copy the committed documentation sites into the output directory (also run inside build).
    cmds:
      - "for d in {{.DOCS_DIRS}}; do rsync -a --delete \"$d/\" \"{{.OUTPUT_DIR}}/$d/\"; done"

  hugo:version:
    desc: Show the Hugo version used for builds.
    cmds:
      - "{{.HUGO_BIN}} version"