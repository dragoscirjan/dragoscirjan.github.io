<footer class="footer shell">
	<span>{{ site.Params.brand | default site.Title }} · {{ site.Params.author.name | default site.Params.author }}</span>
	<nav aria-label="Footer">
		<a href="{{ site.Home.RelPermalink }}">Home</a>
		{{ with site.Params.github }}<a href="https://github.com/{{ . }}">GitHub ↗</a>{{ end }}
		{{ with site.GetPage "/contact" }}<a href="{{ .RelPermalink }}">Contact</a>{{ end }}
		{{ with site.Home.OutputFormats.Get "rss" }}<a href="{{ .Permalink }}">RSS</a>{{ end }}
	</nav>
</footer>
