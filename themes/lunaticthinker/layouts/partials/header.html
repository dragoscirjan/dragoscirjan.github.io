<header class="site-header shell">
	<a class="brand" href="{{ site.Home.RelPermalink }}">
		<strong>{{ site.Params.brand | default site.Title }}</strong>
		<small>{{ site.Params.author.name | default site.Params.author }}</small>
	</a>
	{{ if .IsHome }}
	<p class="manifesto">Code / Poetry / Tools / Ideas</p>
	{{ else }}
	<button class="menu-toggle" data-menu aria-controls="main-nav" aria-expanded="false">Menu</button>
	<nav class="nav" id="main-nav" aria-label="Main navigation">
		{{- range site.Menus.main }}
		<a href="{{ .URL }}"{{ if or (page.IsMenuCurrent "main" .) (page.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
		{{- end }}
	</nav>
	{{ end }}
</header>
