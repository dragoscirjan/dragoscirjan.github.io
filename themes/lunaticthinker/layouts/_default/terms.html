{{ define "main" }}
<main class="lt-container">
	<header class="lt-page-header">
		<p class="lt-eyebrow">{{ .Data.Plural }}</p>
		<h1>{{ .Title }}</h1>
	</header>
	<div class="lt-list">
		{{ range .Paginator.Pages }}
		<a class="lt-list-row" href="{{ .RelPermalink }}">
			<span class="lt-list-topic">{{ .Title }}</span>
			<span>{{ .Pages.Len }} post{{ if gt .Pages.Len 1 }}s{{ end }}</span>
			<span class="lt-list-arrow">↗</span>
		</a>
		{{ end }}
	</div>
</main>
{{ end }}
