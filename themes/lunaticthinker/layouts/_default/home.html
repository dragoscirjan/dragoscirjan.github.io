{{ define "main" }}
<div class="diagonals" aria-hidden="true">
	<i style="--accent:var(--cyan)"></i>
	<i style="--accent:var(--pink)"></i>
	<i style="--accent:var(--amber)"></i>
	<i style="--accent:var(--blue)"></i>
</div>
<main id="main" class="home-main shell">
	<h1 class="sr-only">{{ site.Title }} — personal website</h1>
	<nav class="portals" aria-label="Explore">
		<a class="portal" href="{{ ("/posts/") | relURL }}" style="--accent:var(--cyan)">
			<span class="eyebrow">01</span>
			<h2>Blog</h2>
			<p>Thoughts<br>Explorations<br>Perspectives</p>
			<div class="arrow" aria-hidden="true">⟶</div>
		</a>
		<a class="portal" href="{{ ("/docs/") | relURL }}" style="--accent:var(--pink)">
			<span class="eyebrow">02</span>
			<h2>Projects</h2>
			<p>Things I build<br>Experiments<br>Documentation</p>
			<div class="arrow" aria-hidden="true">⟶</div>
		</a>
		<a class="portal" href="{{ ("/about/") | relURL }}" style="--accent:var(--amber)">
			<span class="eyebrow">03</span>
			<h2>About Me</h2>
			<p>Curiosity<br>Context<br>The human side</p>
			<div class="arrow" aria-hidden="true">⟶</div>
		</a>
		<a class="portal" href="{{ ("/contact/") | relURL }}" style="--accent:var(--blue)">
			<span class="eyebrow">04</span>
			<h2>Contact</h2>
			<p>Let’s talk<br>Ideas<br>Opportunities</p>
			<div class="arrow" aria-hidden="true">⟶</div>
		</a>
	</nav>
</main>
{{ end }}
