# Reusable workflow: publish a project's built documentation site into this
# repository, under projects/<project>/.
#
# Call it from the documentation's source repository after building the docs
# and uploading the generated site as an artifact:
#
#   jobs:
#     publish:
#       needs: build
#       uses: dragoscirjan/dragoscirjan.github.io/.github/workflows/docs.yml@main
#       with:
#         project: mcp-searchable
#       secrets:
#         token: ${{ secrets.PAGES_DOCS_TOKEN }}
#
# Requirements:
# - The calling workflow must upload the built site as an artifact whose name
#   matches the `artifact` input (default: docs-site).
# - The `token` secret must be a personal access token (fine-grained or
#   classic) with contents:write and pull_requests:write on
#   dragoscirjan/dragoscirjan.github.io. Private callers also require
#   actions:read on the caller repository because this token downloads the
#   caller's artifact. Public callers need no source-repository access. A
#   caller's GITHUB_TOKEN cannot write to a different repository.
# - The commit convention matches the existing history:
#   docs(<project>): update documentation site
#
# Merging the generated pull request triggers the Pages deployment workflow.
name: Publish project documentation

on:
  workflow_call:
    inputs:
      project:
        description: "Target folder name under projects/ (e.g. mcp-searchable)"
        required: true
        type: string
      artifact:
        description: "Name of the artifact containing the built documentation site"
        required: false
        default: "docs-site"
        type: string
      source_dir:
        description: "Directory inside the artifact that contains the site root (usually .)"
        required: false
        default: "."
        type: string
    secrets:
      token:
        description: "PAT with destination contents:write and pull_requests:write; private callers also need caller actions:read"
        required: true

permissions:
  contents: read

concurrency:
  group: docs-publish-${{ inputs.project }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish ${{ inputs.project }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          repository: dragoscirjan/dragoscirjan.github.io
          token: ${{ secrets.token }}
          ref: main

      # The artifact lives in the CALLER repository, so the download must be
      # scoped to that run: a bare `name:` lookup only searches this
      # repository's artifacts and fails with "Artifact not found".
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/docs
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.token }}

      # The artifact may also carry extra root entries (e.g. an unwanted
      # `.unlock` file created by upload-artifact); copy only the site files.
      - name: Debug caller artifact API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          echo "caller repo: ${{ github.repository }}  run-id: ${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[] | [.id, .name, .expired, .workflow_run.id // "n/a"] | @tsv' || true
          echo '--- primary download ---'
          ls -la "${{ runner.temp }}/docs" || true

      - name: Validate publication inputs
        env:
          PROJECT: ${{ inputs.project }}
          PUBLISH_BRANCH: docs-publish/${{ inputs.project }}/${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          if [[ ! "${PROJECT}" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::project must contain only lowercase letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi
          if ! git check-ref-format --branch "${PUBLISH_BRANCH}" >/dev/null 2>&1; then
            echo "::error::project does not produce a valid publication branch."
            exit 1
          fi
          if [[ "${SOURCE_DIR}" == /* || "${SOURCE_DIR}" == '..' || "${SOURCE_DIR}" == ../* || "${SOURCE_DIR}" == */../* || "${SOURCE_DIR}" == */.. ]]; then
            echo "::error::source_dir must stay within the downloaded artifact."
            exit 1
          fi

      - name: Replace documentation directory
        env:
          PROJECT: ${{ inputs.project }}
          SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          mkdir -p "projects/${PROJECT}"
          rsync -a --delete "${{ runner.temp }}/docs/${SOURCE_DIR}/" "projects/${PROJECT}/"

      - name: Commit and publish through a pull request
        env:
          DESTINATION_REPOSITORY: dragoscirjan/dragoscirjan.github.io
          GH_TOKEN: ${{ secrets.token }}
          PROJECT: ${{ inputs.project }}
          PUBLISH_BRANCH: docs-publish/${{ inputs.project }}/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "projects/${PROJECT}"
          if git diff --cached --quiet; then
            echo "Documentation for ${PROJECT} is unchanged; nothing to commit."
            exit 0
          fi

          git switch -c "${PUBLISH_BRANCH}"
          git commit -m "docs(${PROJECT}): update documentation site"
          head_commit="$(git rev-parse HEAD)"
          git push --set-upstream origin "${PUBLISH_BRANCH}"

          pull_request_url="$(gh pr create \
            --repo "${DESTINATION_REPOSITORY}" \
            --base main \
            --head "${PUBLISH_BRANCH}" \
            --title "docs(${PROJECT}): update documentation site" \
            --body "Automated documentation publication from https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.")"
          gh pr merge "${pull_request_url}" --merge --delete-branch --match-head-commit "${head_commit}"
